<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日算法讲解 · 历史推送</title>
<style>
:root {
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --bg: #0f172a;
  --card-bg: #1e293b;
  --card-hover: #334155;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --accent: #818cf8;
  --border: #334155;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.8;
}
.container { max-width: 1200px; margin: 0 auto; padding: 24px 32px; }

/* Header */
.header { text-align: center; padding: 40px 0 30px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
.header h1 { font-size: 26px; color: var(--text); margin-bottom: 8px; }
.header h1 .date { color: var(--accent); }
.header .subtitle { color: var(--text-dim); font-size: 15px; }
.stats {
  display: flex; justify-content: center; gap: 24px; margin-top: 16px; flex-wrap: wrap;
}
.stats-item {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 20px;
}
.stats-item .num { font-size: 22px; color: var(--accent); font-weight: 700; }
.stats-item .label { font-size: 13px; color: var(--text-dim); }
.repo-link {
  display: inline-block; margin-top: 14px; padding: 6px 16px;
  background: var(--primary); color: #fff; border-radius: 20px;
  text-decoration: none; font-size: 13px;
}
.repo-link:hover { background: var(--primary-dark); }

/* Search Bar */
.search-bar {
  position: relative; margin-bottom: 16px;
}
.search-bar input {
  width: 100%; padding: 12px 16px 12px 44px;
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); font-size: 15px;
  outline: none; transition: border-color 0.2s;
}
.search-bar input:focus { border-color: var(--primary); }
.search-bar input::placeholder { color: var(--text-dim); }
.search-bar .search-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--text-dim); font-size: 18px;
}
.search-bar .clear-btn {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--text-dim); font-size: 18px;
  cursor: pointer; display: none;
}
.search-bar .clear-btn:hover { color: var(--text); }

/* Category Filters */
.cat-filters {
  display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px;
}
.cat-filter-btn {
  padding: 4px 14px; border-radius: 16px; font-size: 13px;
  background: var(--card-bg); border: 1px solid var(--border);
  color: var(--text-dim); cursor: pointer; transition: all 0.2s;
}
.cat-filter-btn:hover { color: var(--text); border-color: var(--primary); }
.cat-filter-btn.active {
  background: var(--primary); color: #fff; border-color: var(--primary);
}

/* Cards */
.cards { display: flex; flex-direction: column; gap: 12px; }
.card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 20px;
  transition: all 0.2s;
}
.card:hover { background: var(--card-hover); border-color: var(--primary); }
.card-date {
  display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px;
}
.card-date a {
  font-size: 18px; font-weight: 600; color: var(--text);
  text-decoration: none; transition: color 0.2s;
}
.card-date a:hover { color: var(--accent); }
.card-date .weekday { font-size: 13px; color: var(--text-dim); font-weight: 400; }
.card-date .full-date { font-size: 13px; color: var(--text-dim); }

.card-algos { display: flex; flex-wrap: wrap; gap: 8px; }
.algo-tag {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(99,102,241,0.08); border-radius: 8px;
  padding: 4px 10px; font-size: 14px;
}
.algo-tag .algo-name { color: var(--text); font-weight: 500; }
.algo-tag .algo-meta { display: flex; align-items: center; gap: 4px; }
.cat-badge {
  font-size: 11px; padding: 1px 8px; border-radius: 10px;
  background: rgba(99,102,241,0.15); color: var(--accent);
  cursor: pointer; transition: all 0.2s;
}
.cat-badge:hover { background: rgba(99,102,241,0.3); }
.diff-badge {
  font-size: 11px; padding: 1px 8px; border-radius: 10px;
}

/* No results */
.no-results {
  text-align: center; padding: 40px; color: var(--text-dim); font-size: 15px;
  display: none;
}

/* Footer */
.footer {
  text-align: center; padding: 24px 0; margin-top: 32px;
  border-top: 1px solid var(--border); color: var(--text-dim); font-size: 13px;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>每日算法讲解 · <span class="date">历史推送</span></h1>
    <p class="subtitle">查看往期算法讲解内容 · 搜索算法名/类别快速定位</p>
    <div class="stats">
      <div class="stats-item"><span class="num">1</span> <span class="label">天推送</span></div>
      <div class="stats-item"><span class="num">3</span> <span class="label">个算法</span></div>
    </div>
    <a href="https://syypretend.github.io/test/daily-algorithm" target="_blank" class="repo-link">GitHub 仓库</a>
  </div>

  <div class="search-bar">
    <span class="search-icon">&#128269;</span>
    <input type="text" id="searchInput" placeholder="搜索算法名、类别或日期...">
    <button class="clear-btn" id="clearBtn">&times;</button>
  </div>

  <div class="cat-filters" id="catFilters">
    <button class="cat-filter-btn" data-cat="前沿架构">前沿架构</button><button class="cat-filter-btn" data-cat="损失函数">损失函数</button><button class="cat-filter-btn" data-cat="查找算法">查找算法</button>
  </div>

  <div class="cards" id="cardsContainer">
    <div class="card" data-date="2026-09-07" data-search="2026-09-07 快速选择 查找算法 入门 交叉熵损失 损失函数 入门 Mamba 状态空间模型 前沿架构 困难">
            <div class="card-date">
                <a href="2026-09-07.html">09月07日 <span class="weekday">周一</span></a>
                <span class="full-date">2026年09月07日</span>
            </div>
            <div class="card-algos">
                <span class="algo-tag">
                <span class="algo-name">快速选择</span>
                <span class="algo-meta">
                    <span class="cat-badge" data-cat="查找算法">查找算法</span>
                    <span class="diff-badge" style="background:#22c55e22;color:#22c55e;">入门</span>
                </span>
            </span><span class="algo-tag">
                <span class="algo-name">交叉熵损失</span>
                <span class="algo-meta">
                    <span class="cat-badge" data-cat="损失函数">损失函数</span>
                    <span class="diff-badge" style="background:#22c55e22;color:#22c55e;">入门</span>
                </span>
            </span><span class="algo-tag">
                <span class="algo-name">Mamba 状态空间模型</span>
                <span class="algo-meta">
                    <span class="cat-badge" data-cat="前沿架构">前沿架构</span>
                    <span class="diff-badge" style="background:#ef444422;color:#ef4444;">困难</span>
                </span>
            </span>
            </div>
        </div>
  </div>

  <div class="no-results" id="noResults">
    未找到匹配的内容，试试其他关键词
  </div>

  <div class="footer">
    <p>由 TeleAgent · 每日算法推送 技能自动生成 | 2026-09-07 22:48</p>
  </div>
</div>

<script>
(function() {
  const searchInput = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');
  const cards = document.querySelectorAll('.card');
  const noResults = document.getElementById('noResults');
  const catFilterBtns = document.querySelectorAll('.cat-filter-btn');
  let activeCat = '';

  function filterCards() {
    const query = searchInput.value.toLowerCase().trim();
    let visibleCount = 0;

    cards.forEach(card => {
      const searchText = card.dataset.search || '';
      const date = card.dataset.date || '';
      const cardCats = Array.from(card.querySelectorAll('.cat-badge')).map(b => b.dataset.cat);

      let matchSearch = !query || searchText.toLowerCase().includes(query) || date.includes(query);
      let matchCat = !activeCat || cardCats.includes(activeCat);

      if (matchSearch && matchCat) {
        card.style.display = '';
        visibleCount++;
      } else {
        card.style.display = 'none';
      }
    });

    noResults.style.display = visibleCount === 0 ? 'block' : 'none';
  }

  searchInput.addEventListener('input', function() {
    clearBtn.style.display = this.value ? 'block' : 'none';
    filterCards();
  });

  clearBtn.addEventListener('click', function() {
    searchInput.value = '';
    clearBtn.style.display = 'none';
    filterCards();
    searchInput.focus();
  });

  catFilterBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      const cat = this.dataset.cat;
      if (activeCat === cat) {
        activeCat = '';
        this.classList.remove('active');
      } else {
        activeCat = cat;
        catFilterBtns.forEach(b => b.classList.remove('active'));
        this.classList.add('active');
      }
      filterCards();
    });
  });

  // 点击卡片内的类别标签也触发过滤
  document.querySelectorAll('.cat-badge').forEach(badge => {
    badge.addEventListener('click', function(e) {
      e.preventDefault();
      const cat = this.dataset.cat;
      activeCat = cat;
      catFilterBtns.forEach(b => {
        if (b.dataset.cat === cat) b.classList.add('active');
        else b.classList.remove('active');
      });
      filterCards();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
})();
</script>
</body>
</html>
